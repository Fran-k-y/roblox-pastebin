<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RobloxPaste | Powering Imagination</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div id="auth-section" class="screen flex-center">
        <div class="auth-card">
            <div class="rbx-logo-square"></div>
            <h2 id="auth-title">Login to RobloxPaste</h2>
            <div class="auth-form">
                <input type="text" id="username" placeholder="Username" autocomplete="off">
                <input type="password" id="password" placeholder="Password">
                
                <div id="signup-extras" class="hidden">
                    <div class="gender-row">
                        <button class="gender-btn" data-gender="male" onclick="selectGender('male')"><i class="fas fa-mars"></i></button>
                        <button class="gender-btn" data-gender="female" onclick="selectGender('female')"><i class="fas fa-venus"></i></button>
                    </div>
                </div>

                <button class="btn-primary" id="auth-btn" onclick="handleAuth()">Log In</button>
                <p class="toggle-link" onclick="toggleAuthMode()">Don't have an account? Sign Up</p>
            </div>
        </div>
    </div>

    <div id="app-section" class="screen hidden">
        <nav class="rbx-nav">
            <div class="nav-content">
                <div class="nav-left">
                    <div class="menu-icon pc-hide" onclick="toggleSidebar()"><i class="fas fa-bars"></i></div>
                    <span class="brand">ROBLOX<span class="brand-sub">PASTE</span></span>
                </div>
                <div class="nav-right">
                    <div class="plus-wrapper">
                        <button class="nav-plus" onclick="togglePlusMenu()"><i class="fas fa-plus"></i></button>
                        <div id="plus-dropdown" class="rbx-dropdown hidden">
                            <div class="drop-item" onclick="openPasteModal()"><i class="fas fa-file-code"></i> New Paste</div>
                            <div class="drop-item" onclick="openFolderModal()"><i class="fas fa-folder-plus"></i> New Folder</div>
                        </div>
                    </div>
                    <button class="nav-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            </div>
        </nav>

        <div class="app-body">
            <aside id="sidebar" class="rbx-sidebar">
                <div class="sidebar-header">MY FOLDERS</div>
                <div id="folder-list" class="folder-scroll">
                    </div>
            </aside>

            <main class="rbx-main">
                <header class="main-header">
                    <h1 id="view-title">Recent Pastes</h1>
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Search pastes...">
                    </div>
                </header>
                <div id="paste-grid" class="paste-grid">
                    </div>
            </main>
        </div>
    </div>

    <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModals(event)">
        <div class="rbx-modal" onclick="event.stopPropagation()">
            <h3 id="modal-title">Create New Paste</h3>
            <input type="text" id="paste-name" placeholder="Title">
            <textarea id="paste-content" placeholder="Paste content here..."></textarea>
            <div class="modal-row">
                <select id="paste-folder-select"></select>
                <select id="paste-privacy">
                    <option value="public">Public</option>
                    <option value="private">Private</option>
                </select>
            </div>
            <div class="modal-footer">
                <button class="btn-sec" onclick="closeModals()">Cancel</button>
                <button class="btn-primary" onclick="savePaste()">Save Paste</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
